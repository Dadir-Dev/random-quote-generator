<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A random quote generator that delivers
    daily wisdom and inspiration."
    />
    <link rel="stylesheet" href="style.css" />
    <title>Random Quote Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">🌿</div>
        <h1>Quote Garden</h1>
        <p class="subtitle">Curated Wisdom for every moment</p>
      </header>
      <main class="main-content">
        <section
          class="categories"
          id="categories"
          aria-labelledby="quote-categories"
        >
          <button class="category-btn active" aria-label="Category: All">
            All
          </button>
          <button
            class="category-btn"
            aria-label="Category: Motivation"
            data-category="Motivation"
          >
            Motivation
          </button>
          <button
            class="category-btn"
            aria-label="Category: Philosophy"
            data-category="Philosophy"
          >
            Philosophy
          </button>
          <button
            class="category-btn"
            aria-label="Category: Life"
            data-category="Life"
          >
            Life
          </button>
          <button
            class="category-btn"
            aria-label="Category: Personal Finance"
            data-category="Personal Finance"
          >
            Personal Finance
          </button>
          <button
            class="category-btn"
            aria-label="Category: Happiness"
            data-category="Happiness"
          >
            Happiness
          </button>
          <button
            class="category-btn"
            aria-label="Category: Love"
            data-category="Love"
          >
            Love
          </button>
          <button
            class="category-btn"
            aria-label="Category: Programming"
            data-category="Programming"
          >
            Programming
          </button>
          <button
            class="category-btn"
            aria-label="Category: Entrepreneurship"
            data-category="Entrepreneurship"
          >
            Entrepreneurship
          </button>
        </section>
        <section class="quote-container" aria-labelledby="quote">
          <blockquote
            class="quote-text js-quote-text"
            id="quote-text"
          ></blockquote>
          <cite class="quote-author js-quote-author" id="author"> </cite>
          <span class="quote-category js-quote-category"></span>
        </section>
        <section class="controls" aria-label="Quote Controls">
          <div class="movers">
            <button class="btn prev js-prev-btn">
              <span class="btn-icon">⏮️</span>Previous
            </button>
            <button class="btn next js-next-btn">
              <span class="btn-icon">⏭️</span>Next
            </button>
          </div>
          <button class="btn theme js-theme-toggle">
            <span class="btn-icon">🎨</span>
            Theme
          </button>
          <button class="btn copy js-copy-quote">
            <span class="btn-icon">📋</span>Copy Quote
          </button>
        </section>

        <section class="stats" aria-label="Quote Statistics">
          <div class="stats-item">
            <span>📚</span>
            <span class="total-quotes js-total-quotes">0 Quotes</span>
          </div>
          <div class="stats-item">
            <span>🕯️</span>
            <span class="active-category js-active-category">Happiness</span>
          </div>
        </section>
      </main>
    </div>
    <!-- Modern Footer -->
    <footer class="footer">
      <div class="footer-content">
        <div class="developer-info">
          <div>
            <div class="dev-name">Dadir Dev</div>
            <div class="dev-title">Frontend Developer</div>
          </div>
        </div>

        <a
          href="https://github.com/Dadir-Dev"
          class="github-link"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="github-icon" viewBox="0 0 24 24">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            />
          </svg>
          Visit GitHub
        </a>
      </div>

      <div class="footer-bottom">
        &copy; 2025 Dadir Dev. All rights reserved.
      </div>
    </footer>
    <script src="script-improved.js"></script>
  </body>
</html>
