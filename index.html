<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Quote Generator</title>
  </head>
  <body>
    <header>
      <div class="logo">🌿</div>
      <h1>Quote Garden</h1>
      <p class="subtitle">Curated Wisdom for every moment</p>
    </header>
    <main class="main-content">
      <div class="categories" id="categories">
        <button>All</button>
        <button>Motivation</button>
        <button>Innovation</button>
        <button>Life</button>
        <button>Dreams</button>
        <button>Happiness</button>
        <button>Love</button>
        <button>Programming</button>
      </div>
      <div class="quote-container">
        <div class="quote">
          "Your time is limited, so don't waste it living someone else's life."
        </div>
        <div class="author">
          - Steve Jobs <span class="category">Motivation</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn prev">
          <span class="btn-icon">⏮️</span>Previous
        </button>
        <button class="btn random">
          <span class="btn-icon">🎲</span>Theme
        </button>
        <button class="btn copy">
          <span class="btn-icon">📋</span>Copy Quote
        </button>
        <button class="btn next"><span class="btn-icon">⏭️</span>Next</button>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
