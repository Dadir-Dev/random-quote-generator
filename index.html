<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Random Quote Generator</title>
  </head>
  <body>
    <header>
      <div class="logo">🌿</div>
      <h1>Quote Garden</h1>
      <p class="subtitle">Curated Wisdom for every moment</p>
    </header>
    <main class="main-content">
      <div class="categories" id="categories">
        <button class="categories-btn">All</button>
        <button class="categories-btn">Motivation</button>
        <button class="categories-btn">Innovation</button>
        <button class="categories-btn">Life</button>
        <button class="categories-btn">Dreams</button>
        <button class="categories-btn">Happiness</button>
        <button class="categories-btn">Love</button>
        <button class="categories-btn">Programming</button>
      </div>
      <div class="quote-container">
        <div class="quote">
          "Your time is limited, so don't waste it living someone else's life."
        </div>
        <div class="author">
          - Steve Jobs <span class="category">Motivation</span>
        </div>
      </div>
      <div class="controls">
        <div class="movers">
          <button class="btn prev">
            <span class="btn-icon">⏮️</span>Previous
          </button>
          <button class="btn next"><span class="btn-icon">⏭️</span>Next</button>
        </div>
        <button class="btn theme">
          <span class="btn-icon">🎨</span>
          Theme
        </button>
        <button class="btn copy">
          <span class="btn-icon">📋</span>Copy Quote
        </button>
      </div>

      <div class="stats">
        <div class="stats-item">
          <span>📚</span>
          <span class="total-quotes">0 Quotes</span>
        </div>
        <div class="stats-item">
          <span>🕯️</span>
          <span class="active-category">Happiness</span>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
